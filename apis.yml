name: bookatable
description: Bookatable was a European online restaurant reservation platform (bookatable.co.uk /
  bookatable.com). It was acquired by Michelin and later sold into TripAdvisor's TheFork, after which
  the Bookatable brand was retired and its booking service merged into TheFork. As of this enrichment
  pass the domains no longer operate independently — bookatable.co.uk and bookatable.com both redirect
  to TheFork (thefork.co.uk / thefork.com), and there is no surviving Bookatable developer portal, API,
  documentation, or package surface. This profile is retained only as a portfolio lead of
  balderton-capital; the live API surface, if any, lives under thefork.
